[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reproductive-potential-monitor"
version = "0.1.0"
description = "A privacy-first local reproductive health trends demo."
requires-python = ">=3.11"
dependencies = [
  "chromadb>=0.5,<2",
  "cryptography>=42,<47",
  "langchain-ollama>=0.3,<2",
  "langgraph>=0.4,<2",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["fertility_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]